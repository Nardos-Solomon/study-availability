<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Study Session Availability</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
      color: #222;
    }

    h1 {
      text-align: center;
    }

    p {
      text-align: center;
      line-height: 1.5;
    }

    .calendar {
      position: relative;
      width: 100%;
      height: 700px;
      margin-top: 25px;
    }

    .calendar iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>

<body>
  <h1>Study Session Availability</h1>

  <p>
    Please review the available dates and times below. All times are
    shown in Pacific Time (Vancouver).
  </p>

  <p>
    Return to the survey and enter all the dates and times that would
    work for you. Your session is not confirmed until the research
    team contacts you.
  </p>

  <div class="calendar">

    <iframe
  src="https://calendar.google.com/calendar/embed?src=888fdcaf0681991ae88837c78f35623de04e9668584916b678b25c5da92e7bc3%40group.calendar.google.com&amp;ctz=America%2FVancouver&amp;mode=WEEK"
  style="border: 0"
  width="800"
  height="600"
  frameborder="0"
  scrolling="no">
</iframe>

  </div>
</body>
</html>
